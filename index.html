<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PI 환율 계산기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(150deg, #120740 0%, #2D1280 40%, #5A28A8 75%, #7B44CC 100%);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      padding: 24px 16px 40px;
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 28px; }
    .pi-orb {
      width: 80px; height: 80px;
      background: linear-gradient(145deg, #FFD700, #FF8C00);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 46px; font-weight: 900; color: #1E0A50;
      margin: 0 auto 14px;
      box-shadow: 0 0 0 10px rgba(255,215,0,0.12), 0 8px 32px rgba(255,140,0,0.45);
    }
    h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: rgba(255,255,255,0.6); }

    /* ── Input Card ── */
    .input-card {
      background: rgba(255,255,255,0.09);
      border-radius: 22px;
      padding: 20px 20px 16px;
      border: 1.5px solid rgba(255,215,0,0.35);
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .input-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
      color: rgba(255,215,0,0.75); text-transform: uppercase; margin-bottom: 10px;
    }
    .input-row { display: flex; align-items: center; gap: 10px; }
    .pi-sym {
      font-size: 32px; font-weight: 900; flex-shrink: 0;
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    input[type=number] {
      flex: 1; background: transparent; border: none;
      border-bottom: 2px solid rgba(255,215,0,0.5);
      color: #fff; font-size: 36px; font-weight: 700;
      padding: 4px 0; outline: none; letter-spacing: -1px; width: 100%;
      font-family: inherit;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .pi-unit { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.45); flex-shrink: 0; }

    .status-bar {
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.09);
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; flex-wrap: wrap; font-size: 12px;
    }
    .price-label { color: rgba(255,255,255,0.7); }
    .price-num { color: #FFD700; font-size: 15px; font-weight: 700; }
    .price-src { font-size: 10px; color: rgba(255,255,255,0.38); margin-left: 6px; }
    .time-text { font-size: 11px; color: rgba(255,255,255,0.38); }

    /* ── Grid ── */
    .grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 18px;
    }

    .card {
      background: rgba(255,255,255,0.07);
      border-radius: 18px;
      padding: 14px 14px 12px;
      border: 1px solid rgba(255,255,255,0.11);
      backdrop-filter: blur(6px);
      position: relative; overflow: hidden;
    }
    .card.krw {
      background: linear-gradient(140deg, rgba(255,215,0,0.18), rgba(255,140,0,0.10));
      border: 1.5px solid rgba(255,215,0,0.42);
    }

    .badge {
      position: absolute; top: 8px; right: 10px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.07);
      padding: 2px 7px; border-radius: 20px;
    }
    .card.krw .badge { color: #FFD700; background: rgba(255,215,0,0.14); }

    .flag-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px; padding-right: 40px;
    }
    .flag { font-size: 22px; }
    .code { font-size: 14px; font-weight: 800; line-height: 1; }
    .name { font-size: 10px; color: rgba(255,255,255,0.48); margin-top: 2px; }

    .value {
      font-weight: 800; font-size: 20px; color: #fff;
      letter-spacing: -0.5px;
      display: flex; align-items: baseline; gap: 3px; min-height: 26px;
    }
    .card.krw .value { color: #FFD700; }
    .val-sym { font-size: 11px; font-weight: 600; opacity: 0.65; }
    .dim { color: rgba(255,255,255,0.28); font-size: 11px; font-weight: 400; }

    /* ── Refresh ── */
    .refresh-btn {
      display: block; margin: 0 auto;
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      color: #1E0A50; border: none; border-radius: 50px;
      padding: 13px 40px; font-size: 14px; font-weight: 800;
      cursor: pointer; letter-spacing: 0.3px;
      box-shadow: 0 6px 20px rgba(255,200,0,0.35);
      font-family: inherit;
      transition: opacity 0.2s;
    }
    .refresh-btn:disabled {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.4);
      box-shadow: none; cursor: not-allowed;
    }
    .footer {
      text-align: center; margin-top: 12px;
      font-size: 11px; color: rgba(255,255,255,0.35); line-height: 1.7;
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="pi-orb">π</div>
  <h1>PI 환율 계산기</h1>
  <p class="subtitle">BIS 글로벌 거래량 상위 9위 + 🇰🇷 KRW 실시간 환율</p>
</div>

<!-- ── Input ── -->
<div class="input-card">
  <div class="input-label">보유 PI 수량 입력</div>
  <div class="input-row">
    <span class="pi-sym">π</span>
    <input type="number" id="piInput" value="1" min="0" step="any" placeholder="0" oninput="render()" />
    <span class="pi-unit">PI</span>
  </div>
  <div class="status-bar">
    <span id="statusLeft" class="price-label">⏳ 실시간 데이터 불러오는 중…</span>
    <span id="statusRight" class="time-text"></span>
  </div>
</div>

<!-- ── Currency Grid ── -->
<div class="grid" id="grid"></div>

<!-- ── Refresh ── -->
<button class="refresh-btn" id="refreshBtn" onclick="fetchAll()">🔄 환율 새로고침</button>
<p class="footer">
  60초마다 자동 업데이트<br>
  시세: CoinGecko &nbsp;·&nbsp; 환율: Open Exchange Rates
</p>

<script>
const CURRENCIES = [
  { code:'USD', name:'미국 달러',   flag:'🇺🇸', sym:'$',   rank:1,   dec:4 },
  { code:'EUR', name:'유로',        flag:'🇪🇺', sym:'€',   rank:2,   dec:4 },
  { code:'JPY', name:'일본 엔',     flag:'🇯🇵', sym:'¥',   rank:3,   dec:0 },
  { code:'GBP', name:'영국 파운드', flag:'🇬🇧', sym:'£',   rank:4,   dec:4 },
  { code:'CNY', name:'중국 위안',   flag:'🇨🇳', sym:'¥',   rank:5,   dec:2 },
  { code:'CHF', name:'스위스 프랑', flag:'🇨🇭', sym:'Fr',  rank:6,   dec:4 },
  { code:'AUD', name:'호주 달러',   flag:'🇦🇺', sym:'A$',  rank:7,   dec:4 },
  { code:'CAD', name:'캐나다 달러', flag:'🇨🇦', sym:'C$',  rank:8,   dec:4 },
  { code:'HKD', name:'홍콩 달러',   flag:'🇭🇰', sym:'HK$', rank:9,   dec:2 },
  { code:'KRW', name:'한국 원',     flag:'🇰🇷', sym:'₩',  rank:'★', dec:0 },
];

let piUsd = null, rates = null, lastUpdated = null;

// ── 그리드 초기 렌더링 ──
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = CURRENCIES.map(c => {
    const isKrw = c.code === 'KRW';
    return `
      <div class="card${isKrw ? ' krw' : ''}" id="card-${c.code}">
        <div class="badge">${isKrw ? 'KRW' : 'BIS #' + c.rank}</div>
        <div class="flag-row">
          <span class="flag">${c.flag}</span>
          <div>
            <div class="code">${c.code}</div>
            <div class="name">${c.name}</div>
          </div>
        </div>
        <div class="value" id="val-${c.code}">
          <span class="dim">로딩중…</span>
        </div>
      </div>`;
  }).join('');
}

// ── 값 포매팅 ──
function fmt(v, dec) {
  if (v === null || isNaN(v)) return null;
  return new Intl.NumberFormat('ko-KR', {
    minimumFractionDigits: dec === 0 ? 0 : 2,
    maximumFractionDigits: dec,
  }).format(v);
}

// ── 화면 업데이트 ──
function render() {
  const amt = parseFloat(document.getElementById('piInput').value);
  const hasAmt = !isNaN(amt) && amt > 0;

  CURRENCIES.forEach(c => {
    const el = document.getElementById('val-' + c.code);
    if (!el) return;
    if (!piUsd || !rates) {
      el.innerHTML = '<span class="dim">로딩중…</span>'; return;
    }
    if (!hasAmt) {
      el.innerHTML = '<span class="dim">수량 입력</span>'; return;
    }
    const raw = amt * piUsd * (rates[c.code] || 0);
    const v = fmt(raw, c.dec);
    if (!v) { el.innerHTML = '<span class="dim">—</span>'; return; }
    // 자릿수에 따라 폰트 크기 조정
    const fs = v.length > 12 ? '13px' : v.length > 8 ? '16px' : '20px';
    el.style.fontSize = fs;
    el.innerHTML = `<span class="val-sym">${c.sym}</span><span>${v}</span>`;
  });
}

// ── PI 가격 가져오기 ──
async function fetchPiPrice() {
  const ids = ['pi-network', 'pi-network-iou'];
  for (const id of ids) {
    try {
      const r = await fetch(
        `https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd`,
        { signal: AbortSignal.timeout(6000) }
      );
      if (r.ok) {
        const d = await r.json();
        const p = d[id]?.usd;
        if (p > 0) return { price: p, src: 'CoinGecko' };
      }
    } catch {}
  }
  return { price: null, src: null };
}

// ── 환율 가져오기 ──
async function fetchRates() {
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/USD',
      { signal: AbortSignal.timeout(6000) });
    if (r.ok) {
      const d = await r.json();
      if (d.result === 'success') return d.rates;
    }
  } catch {}
  return null;
}

// ── 전체 데이터 가져오기 ──
async function fetchAll() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 업데이트 중…';
  document.getElementById('statusLeft').textContent = '⏳ 실시간 데이터 불러오는 중…';

  const [piResult, ratesResult] = await Promise.all([fetchPiPrice(), fetchRates()]);

  if (piResult.price) {
    piUsd = piResult.price;
    document.getElementById('statusLeft').innerHTML =
      `1 PI = <strong class="price-num">$${piUsd.toFixed(4)}</strong>` +
      (piResult.src ? `<span class="price-src">(${piResult.src})</span>` : '');
  } else {
    document.getElementById('statusLeft').innerHTML =
      '<span style="color:#FF7043">⚠️ PI 가격을 불러올 수 없습니다</span>';
  }

  if (ratesResult) rates = ratesResult;

  lastUpdated = new Date();
  document.getElementById('statusRight').textContent =
    '🕐 ' + lastUpdated.toLocaleTimeString('ko-KR');

  render();
  btn.disabled = false;
  btn.textContent = '🔄 환율 새로고침';
}

// ── 시작 ──
buildGrid();
fetchAll();
setInterval(fetchAll, 60000);
</script>
</body>
</html>
